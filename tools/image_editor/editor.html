<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Image Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .canvas-container {
            position: relative;
            display: inline-block;
            border: 2px solid #e5e7eb;
            background: 
                linear-gradient(45deg, #f3f4f6 25%, transparent 25%),
                linear-gradient(-45deg, #f3f4f6 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f3f4f6 75%),
                linear-gradient(-45deg, transparent 75%, #f3f4f6 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        .marquee {
            position: absolute;
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">PNG Image Editor</h1>
        
        <!-- Controls -->
        <div class="bg-white p-4 rounded-lg shadow-md mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <input type="file" id="fileInput" accept=".png,image/png" class="hidden">
                <button onclick="openFile()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors">
                    Open PNG
                </button>
                <button onclick="cropImage()" id="cropBtn" disabled class="bg-green-500 hover:bg-green-600 disabled:bg-gray-400 text-white px-4 py-2 rounded transition-colors">
                    Crop Selection
                </button>
                <button onclick="saveImage()" id="saveBtn" disabled class="bg-purple-500 hover:bg-purple-600 disabled:bg-gray-400 text-white px-4 py-2 rounded transition-colors">
                    Save As PNG
                </button>
                <span id="status" class="text-gray-600"></span>
                <span class="text-sm text-gray-500 ml-4">Hold Shift for square selection</span>
            </div>
        </div>
        
        <!-- Canvas Container -->
        <div class="bg-white p-4 rounded-lg shadow-md">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="canvas" style="display: none;"></canvas>
                <div class="marquee" id="marquee" style="display: none;"></div>
            </div>
            <div id="placeholder" class="text-center py-20 text-gray-500">
                Click "Open PNG" to load an image
            </div>
        </div>
    </div>

    <script>
        let canvas, ctx;
        let originalImage = null;
        let isDrawing = false;
        let startX, startY, currentX, currentY;
        let marqueeSelection = null;
        
        function init() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            // File input handler
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            
            // Canvas mouse events for marquee selection
            canvas.addEventListener('mousedown', startMarquee);
            canvas.addEventListener('mousemove', updateMarquee);
            canvas.addEventListener('mouseup', endMarquee);
        }
        
        function openFile() {
            document.getElementById('fileInput').click();
        }
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.type !== 'image/png') {
                alert('Please select a PNG file.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                loadImage(e.target.result);
            };
            reader.readAsDataURL(file);
        }
        
        function loadImage(src) {
            const img = new Image();
            img.onload = function() {
                originalImage = img;
                
                // Set canvas size to image size
                canvas.width = img.width;
                canvas.height = img.height;
                
                // Clear canvas and draw image
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                
                // Show canvas, hide placeholder
                canvas.style.display = 'block';
                document.getElementById('placeholder').style.display = 'none';
                document.getElementById('saveBtn').disabled = false;
                
                updateStatus('Image loaded. Drag to select crop area.');
                clearMarquee();
            };
            img.src = src;
        }
        
        function startMarquee(e) {
            if (!originalImage) return;
            
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;
            
            // Show marquee
            document.getElementById('marquee').style.display = 'block';
        }
        
        function updateMarquee(e) {
            if (!isDrawing || !originalImage) return;
            
            const rect = canvas.getBoundingClientRect();
            let tempCurrentX = e.clientX - rect.left;
            let tempCurrentY = e.clientY - rect.top;
            
            // If shift is held, make it a square
            if (e.shiftKey) {
                const deltaX = Math.abs(tempCurrentX - startX);
                const deltaY = Math.abs(tempCurrentY - startY);
                const size = Math.max(deltaX, deltaY);
                
                // Determine direction and apply square constraint
                currentX = startX + (tempCurrentX >= startX ? size : -size);
                currentY = startY + (tempCurrentY >= startY ? size : -size);
            } else {
                currentX = tempCurrentX;
                currentY = tempCurrentY;
            }
            
            // Calculate marquee dimensions
            const left = Math.min(startX, currentX);
            const top = Math.min(startY, currentY);
            const width = Math.abs(currentX - startX);
            const height = Math.abs(currentY - startY);
            
            // Update marquee position and size
            const marquee = document.getElementById('marquee');
            marquee.style.left = left + 'px';
            marquee.style.top = top + 'px';
            marquee.style.width = width + 'px';
            marquee.style.height = height + 'px';
        }
        
        function endMarquee(e) {
            if (!isDrawing) return;
            isDrawing = false;
            
            const rect = canvas.getBoundingClientRect();
            let tempCurrentX = e.clientX - rect.left;
            let tempCurrentY = e.clientY - rect.top;
            
            // If shift is held, make it a square
            if (e.shiftKey) {
                const deltaX = Math.abs(tempCurrentX - startX);
                const deltaY = Math.abs(tempCurrentY - startY);
                const size = Math.max(deltaX, deltaY);
                
                // Determine direction and apply square constraint
                currentX = startX + (tempCurrentX >= startX ? size : -size);
                currentY = startY + (tempCurrentY >= startY ? size : -size);
            } else {
                currentX = tempCurrentX;
                currentY = tempCurrentY;
            }
            
            // Store selection
            marqueeSelection = {
                x: Math.min(startX, currentX),
                y: Math.min(startY, currentY),
                width: Math.abs(currentX - startX),
                height: Math.abs(currentY - startY)
            };
            
            // Enable crop button if selection has area
            if (marqueeSelection.width > 5 && marqueeSelection.height > 5) {
                document.getElementById('cropBtn').disabled = false;
                updateStatus('Selection made. Click "Crop Selection" to crop.');
            } else {
                clearMarquee();
            }
        }
        
        function clearMarquee() {
            document.getElementById('marquee').style.display = 'none';
            document.getElementById('cropBtn').disabled = true;
            marqueeSelection = null;
        }
        
        function cropImage() {
            if (!originalImage || !marqueeSelection) return;
            
            // Create new canvas for cropped image
            const newCanvas = document.createElement('canvas');
            const newCtx = newCanvas.getContext('2d');
            
            // Set new canvas size to selection size
            newCanvas.width = marqueeSelection.width;
            newCanvas.height = marqueeSelection.height;
            
            // Draw cropped portion
            newCtx.drawImage(
                canvas,
                marqueeSelection.x, marqueeSelection.y, marqueeSelection.width, marqueeSelection.height,
                0, 0, marqueeSelection.width, marqueeSelection.height
            );
            
            // Update main canvas
            canvas.width = marqueeSelection.width;
            canvas.height = marqueeSelection.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(newCanvas, 0, 0);
            
            // Clear marquee
            clearMarquee();
            updateStatus('Image cropped successfully.');
        }
        
        function saveImage() {
            if (!canvas) return;
            
            // Create download link
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'cropped-image.png';
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
                updateStatus('Image saved successfully.');
            }, 'image/png');
        }
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        // Initialize when page loads
        window.onload = init;
    </script>
</body>
</html>
