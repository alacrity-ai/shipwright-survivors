<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quick Background Remover (Sample→Mask→Export)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0e1116; --fg:#e6f0ff; --accent:#36c; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px/1.3 system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  .wrap { display:grid; grid-template-columns: 320px 1fr; gap:16px; height:100%; padding:14px; box-sizing:border-box; }
  .panel {
    background:#151a22; border:1px solid #222937; border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
  }
  .panel h2 { margin:0 0 6px; font-size:14px; opacity:.9; letter-spacing:.2px; }
  .controls label { display:block; margin:6px 0 4px; opacity:.9; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  input[type="file"] { color:var(--fg); }
  button {
    padding:8px 12px; border-radius:8px; border:1px solid #2a3550; background:#1a2440; color:var(--fg);
    cursor:pointer; transition:transform .02s ease, background .2s; font-weight:600;
  }
  button:hover { background:#20315f; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input[type="range"] { width:100%; }
  .swatch { width:36px; height:24px; border-radius:6px; border:1px solid #2a2f3a; background:#000; }
  .chip { font:12px/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; opacity:.85; }
  .notice { font-size:12px; opacity:.75; }
  .canvas-wrap {
    position:relative; background:
      conic-gradient(#0000 0 25%,#0001 0 50%,#0000 0 75%,#0001 0) 0 0/20px 20px,
      linear-gradient(90deg,#1b1f28,#141820);
    border:1px solid #222937; border-radius:10px; display:flex; align-items:center; justify-content:center;
    min-height:200px; overflow:hidden;
  }
  canvas#view { max-width:100%; max-height:100%; width:100%; height:100%; display:block; }
  .hint { position:absolute; bottom:8px; left:10px; padding:4px 8px; border-radius:6px; background:rgba(0,0,0,.35); font-size:12px; }
  .kbd { padding:1px 6px; border-radius:4px; background:#0f1420; border:1px solid #25314a; font:11px ui-monospace, monospace; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h2>Image & Actions</h2>
      <div class="controls">
        <div class="row">
          <input id="file" type="file" accept="image/*" />
          <button id="removeBtn" disabled>Remove Background</button>
          <button id="exportBtn" disabled>Export PNG</button>
        </div>
        <div class="grid">
          <div>
            <label>Threshold (ΔE fully transparent)</label>
            <input id="thresh" type="range" min="2" max="80" value="18" />
            <div class="row"><span class="chip">ΔE: <span id="threshVal">18</span></span></div>
          </div>
          <div>
            <label>Feather width (ΔE to opaque)</label>
            <input id="feather" type="range" min="2" max="120" value="30" />
            <div class="row"><span class="chip">ΔE: <span id="featherVal">30</span></span></div>
          </div>
        </div>
        <div class="row">
          <label>Sampled color</label>
          <div id="swatch" class="swatch" title="Background sample"></div>
          <span class="chip" id="rgbText">—</span>
        </div>
        <div class="notice">Click on the background area of the image to sample. The sampler uses a circular radius of 64 px in image space.</div>
      </div>
    </section>

    <section class="panel" style="display:grid; grid-template-rows: 1fr auto;">
      <div class="canvas-wrap">
        <canvas id="view"></canvas>
        <div class="hint">Click image to sample • <span class="kbd">R</span> re-fit</div>
      </div>
      <div class="row" style="justify-content:space-between; margin-top:10px;">
        <span class="notice">Transparency preview shows a subtle checkerboard behind the canvas.</span>
        <div class="row">
          <label class="row" style="gap:6px;"><input type="checkbox" id="showMask"> Show mask overlay</label>
        </div>
      </div>
    </section>
  </div>

<script>
(() => {
  // --- Utilities: sRGB → Lab for perceptual ΔE ---
  const srgbToLinear = c => (c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4));
  function rgbToXyz(r,g,b) {
    // sRGB D65
    r = srgbToLinear(r/255); g = srgbToLinear(g/255); b = srgbToLinear(b/255);
    const x = r*0.4124564 + g*0.3575761 + b*0.1804375;
    const y = r*0.2126729 + g*0.7151522 + b*0.0721750;
    const z = r*0.0193339 + g*0.1191920 + b*0.9503041;
    return [x,y,z];
  }
  function xyzToLab(x,y,z) {
    // D65 white
    const Xn=0.95047, Yn=1.00000, Zn=1.08883;
    let fx = f(x/Xn), fy = f(y/Yn), fz = f(z/Zn);
    return [116*fy - 16, 500*(fx - fy), 200*(fy - fz)];
    function f(t){ return t>0.008856 ? Math.cbrt(t) : (7.787*t + 16/116); }
  }
  function rgbToLab(r,g,b) { const [x,y,z] = rgbToXyz(r,g,b); return xyzToLab(x,y,z); }
  const deltaE = (L1,a1,b1, L2,a2,b2) => {
    const dL=L1-L2, da=a1-a2, db=b1-b2;
    return Math.sqrt(dL*dL + da*da + db*db); // ΔE*76, sufficient here
  };

  // --- DOM refs ---
  const file = document.getElementById('file');
  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d');
  const removeBtn = document.getElementById('removeBtn');
  const exportBtn = document.getElementById('exportBtn');
  const thresh = document.getElementById('thresh');
  const feather = document.getElementById('feather');
  const threshVal = document.getElementById('threshVal');
  const featherVal = document.getElementById('featherVal');
  const swatch = document.getElementById('swatch');
  const rgbText = document.getElementById('rgbText');
  const showMask = document.getElementById('showMask');

  thresh.addEventListener('input', ()=>threshVal.textContent = thresh.value);
  feather.addEventListener('input', ()=>featherVal.textContent = feather.value);

  // An offscreen "full-res" canvas keeps the working image at native size
  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently:true });

  // State
  let imgBitmap = null;
  let haveSample = false;
  let sample = { L:0, a:0, b:0, meanRgb:[0,0,0] };
  let maskAlpha = null; // Uint8ClampedArray for preview toggle
  let viewTransform = { scale:1, dx:0, dy:0 }; // image→view fit

  // Fit image into the view canvas while preserving aspect.
  function fit() {
    if (!imgBitmap) return;
    // Size view canvas to container
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = Math.max(200, Math.floor(rect.width));
    canvas.height = Math.max(200, Math.floor(rect.height - 40));

    // Compute "contain" fit
    const s = Math.min(canvas.width / work.width, canvas.height / work.height);
    const dw = Math.floor(work.width * s), dh = Math.floor(work.height * s);
    const dx = Math.floor((canvas.width - dw)/2), dy = Math.floor((canvas.height - dh)/2);

    viewTransform = { scale:s, dx, dy };

    // Draw
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(work, 0,0, work.width,work.height, dx,dy,dw,dh);

    // Optional mask overlay
    if (showMask.checked && maskAlpha) overlayMask();
  }

  function overlayMask() {
    if (!maskAlpha) return;
    const { scale, dx, dy } = viewTransform;
    // Create a semi-transparent red overlay from maskAlpha
    const overlay = ctx.createImageData(work.width, work.height);
    const data = overlay.data;
    for (let i=0, j=0; i<maskAlpha.length; i++, j+=4) {
      const a = maskAlpha[i]; // 0..255 final alpha
      // Show removed background in red
      data[j+0] = 255;
      data[j+1] = 0;
      data[j+2] = 0;
      data[j+3] = 128 * (255 - a) / 255; // more red where more transparent
    }
    // Draw scaled
    const tmp = document.createElement('canvas');
    tmp.width = work.width; tmp.height = work.height;
    tmp.getContext('2d').putImageData(overlay,0,0);
    ctx.drawImage(tmp, dx,dy, work.width*scale, work.height*scale);
  }

  // Map a click in the view canvas back to image coordinates
  function toImageSpace(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;
    const { scale, dx, dy } = viewTransform;
    const ix = (x - dx) / scale;
    const iy = (y - dy) / scale;
    return { ix: Math.round(ix), iy: Math.round(iy) };
  }

  // Sample mean color within a circular radius (64 px) in image space
  function sampleAt(ix, iy, radius = 64) {
    const x0 = Math.max(0, ix - radius), y0 = Math.max(0, iy - radius);
    const x1 = Math.min(work.width - 1, ix + radius), y1 = Math.min(work.height - 1, iy + radius);
    const w = x1 - x0 + 1, h = y1 - y0 + 1;
    const img = wctx.getImageData(x0, y0, w, h).data;

    let sumR=0, sumG=0, sumB=0, count=0;
    const r2 = radius*radius;

    for (let yy=0; yy<h; yy++) {
      for (let xx=0; xx<w; xx++) {
        const dx = (x0+xx) - ix, dy = (y0+yy) - iy;
        if (dx*dx + dy*dy > r2) continue; // circle
        const i = (yy*w + xx) * 4;
        const a = img[i+3];
        if (a === 0) continue; // ignore fully transparent
        const r = img[i], g = img[i+1], b = img[i+2];
        sumR += r; sumG += g; sumB += b;
        count++;
      }
    }

    if (!count) return null;

    const meanR = Math.round(sumR / count);
    const meanG = Math.round(sumG / count);
    const meanB = Math.round(sumB / count);
    const [L,a,b] = rgbToLab(meanR, meanG, meanB);
    return { L, a, b, meanRgb:[meanR, meanG, meanB] };
  }

  // Apply background removal using ΔE thresholds (soft feather)
  function removeBackground(sample, T=18, F=30) {
    // T = fully transparent if ΔE <= T; alpha ramps up over [T, T+F]
    const w = work.width, h = work.height;
    const img = wctx.getImageData(0,0,w,h);
    const data = img.data;

    // Precompute a Lab buffer for speed (optional: we can do on the fly)
    // Here we do on the fly to avoid extra memory.
    const [Ls,as,bs] = [sample.L, sample.a, sample.b];
    const invF = 1 / Math.max(1, F);

    // Keep a copy of output alpha for overlay
    maskAlpha = new Uint8ClampedArray(w*h);

    for (let p=0, q=0; p<data.length; p+=4, q++) {
      const r = data[p], g = data[p+1], b = data[p+2], a = data[p+3];
      if (a === 0) { maskAlpha[q] = 0; continue; }

      const [L, A, B] = rgbToLab(r,g,b);
      const dE = deltaE(L,A,B, Ls,as,bs);

      // Compute target alpha multiplier based on ΔE
      // dE <= T => alpha 0, dE >= T+F => alpha 1
      let m = (dE - T) * invF;
      if (m < 0) m = 0; else if (m > 1) m = 1;

      const newA = Math.round(a * m);
      data[p+3] = newA;
      maskAlpha[q] = newA;
    }

    wctx.putImageData(img, 0, 0);
    fit(); // redraw into view at current fit
  }

  // --- Event wiring ---
  file.addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = async () => {
      // Prepare work canvas
      work.width = img.naturalWidth; work.height = img.naturalHeight;
      wctx.clearRect(0,0,work.width,work.height);
      wctx.drawImage(img, 0,0);
      imgBitmap = img;
      maskAlpha = null;
      haveSample = false;
      updateSampleUI(null);
      removeBtn.disabled = true;
      exportBtn.disabled = false; // allow export original too

      fit();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  canvas.addEventListener('click', (e) => {
    if (!imgBitmap) return;
    const { ix, iy } = toImageSpace(e.clientX, e.clientY);
    if (ix < 0 || iy < 0 || ix >= work.width || iy >= work.height) return;

    const s = sampleAt(ix, iy, 64);
    if (!s) return;
    sample = s;
    haveSample = true;
    updateSampleUI(s);
    removeBtn.disabled = false;

    // Visual ping
    ctx.save();
    ctx.strokeStyle = 'rgba(0,255,255,.85)';
    ctx.lineWidth = 2;
    const { scale, dx, dy } = viewTransform;
    ctx.beginPath();
    ctx.arc(Math.round(dx + ix*scale), Math.round(dy + iy*scale), Math.max(6, 64*scale), 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  });

  function updateSampleUI(s) {
    if (!s) {
      swatch.style.background = '#000';
      rgbText.textContent = '—';
      return;
    }
    const [r,g,b] = s.meanRgb;
    swatch.style.background = `rgb(${r}, ${g}, ${b})`;
    rgbText.textContent = `rgb(${r},${g},${b}) · Lab(${s.L.toFixed(1)}, ${s.a.toFixed(1)}, ${s.b.toFixed(1)})`;
  }

  removeBtn.addEventListener('click', () => {
    if (!haveSample || !imgBitmap) return;
    removeBackground(sample, parseInt(thresh.value,10), parseInt(feather.value,10));
  });

  exportBtn.addEventListener('click', () => {
    if (!imgBitmap) return;
    // Export current "work" canvas as PNG
    work.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'image-transparent.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 250);
    }, 'image/png');
  });

  showMask.addEventListener('change', fit);
  window.addEventListener('resize', fit);
  window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'r') fit(); // re-fit
  });

  // Initial UI numbers
  thresh.dispatchEvent(new Event('input'));
  feather.dispatchEvent(new Event('input'));
})();
</script>
</body>
</html>
