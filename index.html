<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shipwright-survivors/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipwright Survivors</title>
    <style>
      /* Additional inline styles just for the loading ellipsis */

      #splash-screen p {
        display: flex;
        align-items: flex-end;
        font-size: 3.5rem;
        gap: 2px;
      }

      .dot {
        display: inline-block;
        width: 0.5ch;
        animation: bounce 1.2s infinite ease-in-out;
      }

      .dot:nth-child(2) {
        animation-delay: 0.15s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes bounce {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-0.25em);
        }
      }
    </style>
    <script type="module" crossorigin src="/shipwright-survivors/assets/index-CR2osUro.js"></script>
    <link rel="stylesheet" crossorigin href="/shipwright-survivors/assets/index-DK4PJ_fN.css">
  </head>
  <body>
    <!-- Splash screen shown before React mounts -->
    <div id="splash-screen">
      <img src="/shipwright-survivors/logo.png" alt="Shipwright Logo" />
      <p>
        Loading
        <span class="dot">.</span>
        <span class="dot">.</span>
        <span class="dot">.</span>
      </p>
    </div>

    <!-- React root container -->
    <div id="root"></div>

    <!-- Main application script -->
  </body>
</html>
